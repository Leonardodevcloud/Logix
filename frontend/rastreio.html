<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title id="ttl">Acompanhe sua entrega</title>
  <link id="fav" rel="icon" href="data:," />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root{--navy:#042C53;--azul:#185FA5;--azul2:#378ADD;--ok:#1F9D6B;--erro:#D0584F;--aten:#C98A1A;--tinta:#0F2740;--tinta2:#486485;--tinta3:#8AA2BE;--linha:#E6EDF5;--fundo:#EEF3F9;--marca:#185FA5}
    *{box-sizing:border-box;margin:0}html,body{height:100%}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--fundo);color:var(--tinta);-webkit-font-smoothing:antialiased}
    .top{background:#fff;border-bottom:1px solid var(--linha);padding:13px 20px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:20}
    .top .mono{width:38px;height:38px;border-radius:11px;background:var(--marca);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;overflow:hidden;flex:0 0 38px}
    .top .mono img{width:100%;height:100%;object-fit:contain}
    .top b{font-size:15px}.top .s{font-size:12px;color:var(--tinta2)}
    .top .prot{margin-left:auto;font-size:12px;color:var(--tinta2);text-align:right}.top .prot b{color:var(--tinta)}
    .wrap{display:grid;grid-template-columns:1fr 400px;height:calc(100vh - 65px);min-height:520px}
    .map{position:relative;background:#dfe8f2}#mapa{position:absolute;inset:0}
    .etatag{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#fff;border-radius:30px;padding:10px 20px;box-shadow:0 8px 22px rgba(4,44,83,.18);font-weight:800;color:var(--navy);font-size:15px;z-index:600;display:none;align-items:center;gap:8px;white-space:nowrap}
    .etatag i{width:9px;height:9px;border-radius:50%;background:var(--azul2);animation:pulseDot 1.4s infinite}
    .side{background:#fff;border-left:1px solid var(--linha);padding:24px;overflow:auto}
    .big{font-size:26px;font-weight:900;color:var(--navy);line-height:1.1}.subl{font-size:13.5px;color:var(--tinta2);margin-top:4px}
    .chip{display:inline-flex;align-items:center;gap:7px;margin-top:13px;font-weight:800;font-size:12.5px;padding:6px 13px;border-radius:20px}
    .chip.a{background:#E4EEF9;color:var(--azul)}.chip.f{background:#E4F5EE;color:#0f6e56}.chip.sp{background:#FBF1DD;color:var(--aten)}.chip.c{background:#FBE8E6;color:var(--erro)}
    .chip .d{width:8px;height:8px;border-radius:50%;background:currentColor}.chip.ativo .d{animation:pulseDot 1.4s infinite}
    @keyframes pulseDot{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 7px transparent;opacity:.6}100%{box-shadow:0 0 0 0 transparent;opacity:1}}
    .tl{margin:24px 0 6px}.step{display:flex;gap:13px;position:relative;padding-bottom:20px}.step:last-child{padding-bottom:0}
    .step .dot{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:flex;align-items:center;justify-content:center;font-size:13px;z-index:2;transition:.3s}
    .step .dot.done{background:var(--ok);color:#fff}
    .step .dot.now{background:var(--azul);color:#fff;animation:pulseNow 1.6s infinite}
    @keyframes pulseNow{0%{box-shadow:0 0 0 0 rgba(24,95,165,.5)}70%{box-shadow:0 0 0 9px rgba(24,95,165,0)}100%{box-shadow:0 0 0 0 rgba(24,95,165,0)}}
    .step .dot.next{background:#dbe6f2;color:var(--tinta3)}
    .step .ln{position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--linha)}.step .ln.on{background:var(--ok)}
    .step .tx b{font-size:14px;color:var(--tinta);display:block}.step .tx small{font-size:12px;color:var(--tinta2)}.step.fut .tx b{color:var(--tinta3)}
    .card{border:1px solid var(--linha);border-radius:14px;padding:15px;margin-top:8px}
    .card .rot{font-size:10.5px;font-weight:800;color:var(--tinta3);text-transform:uppercase;letter-spacing:.4px}.card .v{font-size:14px;color:var(--tinta);font-weight:600;margin-top:3px}
    .mb{display:flex;align-items:center;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--fundo)}
    .mb .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#0C447C,#185FA5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 46px;overflow:hidden}
    .mb .av img{width:100%;height:100%;object-fit:cover}.mb b{font-size:14px;color:var(--tinta)}.mb small{font-size:12px;color:var(--tinta2);display:block}
    .mb .lig{margin-left:auto;background:var(--ok);color:#fff;border-radius:10px;padding:9px 13px;font-size:12.5px;font-weight:800;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
    .foot{margin-top:20px;font-size:11px;color:var(--tinta3);text-align:center}
    .carregando,.erro{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;color:var(--tinta2);text-align:center;padding:30px}
    .spin{width:32px;height:32px;border:3px solid #cddcec;border-top-color:var(--marca);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
    @media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto;min-height:0}.map{height:300px}.side{border-left:none;border-top:1px solid var(--linha)}.etatag{font-size:14px;padding:9px 16px}}
  </style>
</head>
<body>
  <div id="boot" class="carregando"><div class="spin"></div><div>Carregando sua entrega…</div></div>
  <div id="app" style="display:none">
    <div class="top"><div class="mono" id="mono"></div><div><b id="marcaNome">Acompanhe sua entrega</b><div class="s">Acompanhe sua entrega em tempo real</div></div><div class="prot">Protocolo <b id="prot"></b><br>atualiza automaticamente</div></div>
    <div class="wrap"><div class="map"><div id="mapa"></div><div class="etatag" id="eta"><i></i> <span></span></div></div><div class="side" id="side"></div></div>
  </div>
<script>
(function(){
  var API = 'https://logix-production-61ae.up.railway.app/api/v1';
  var mPath = location.pathname.match(/\/rastreio\/([^/?#]+)/);
  var qp = new URLSearchParams(location.search);
  var token = (mPath && mPath[1]) || qp.get('t') || qp.get('token') || '';
  var boot=document.getElementById('boot'), app=document.getElementById('app');
  var mapa=null, mkMoto=null, mkDest=null, mkColeta=null, linhaTraj=null, primeira=true, montado=false, brandFeito=false, timer=null, corMarca='#185FA5', fotoMotoboy=null;

  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function hora(iso){ if(!iso) return ''; try{return new Date(iso).toLocaleString('pt-BR',{timeZone:'America/Bahia',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }
  function distKm(a,b){ if(!a||!b) return null; var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180; var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2); return 2*R*Math.asin(Math.sqrt(x)); }
  function ini(t){return String(t||'').trim().split(/\s+/).map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
  function estagio(st){ if(st==='entregue') return 4; if(st==='em_rota') return 2; if(st==='em_coleta'||st==='aguardando_coleta') return 1; return 0; }
  function soDigitos(t){return String(t||'').replace(/\D/g,'');}

  // Marca (favicon + título + cor) — aplica uma vez.
  function aplicarMarca(d){
    if(brandFeito) return; brandFeito=true;
    var cor=(d.marca&&d.marca.cor)||'#185FA5'; corMarca=cor; document.documentElement.style.setProperty('--marca',cor);
    var nome=(d.marca&&d.marca.nome)||d.loja||'Acompanhe sua entrega';
    document.getElementById('marcaNome').textContent=nome;
    document.getElementById('ttl').textContent=nome+' · Rastreio';
    var logo=d.marca&&d.marca.logo;
    document.getElementById('mono').innerHTML = logo? '<img src="'+esc(logo)+'" alt="">' : esc(ini(nome));
    // Favicon: usa a logo do cliente se houver; senão um quadrado com a cor+iniciais (SVG).
    var favHref = logo || ('data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="'+cor+'"/><text x="32" y="43" font-family="Arial" font-weight="bold" font-size="26" fill="#fff" text-anchor="middle">'+ini(nome)+'</text></svg>'));
    document.getElementById('fav').setAttribute('href', favHref);
  }

  function atualizarSide(d){
    if(!fotoMotoboy && d.motoboy && d.motoboy.foto) fotoMotoboy = d.motoboy.foto; // fixa a foto (URL assinada muda a cada request -> evita piscar)
    var entregue=d.status==='entregue', cancelada=d.status==='cancelada', est=estagio(d.status);
    var pts=d.pontos||[]; var destino=pts.find(function(p){return p.status!=='entregue'&&p.status!=='finalizado';})||pts[pts.length-1]||null;
    var mb0=d.motoboy||{};
    // Retorno / insucesso = houve problema na entrega (não foi entregue).
    var problema = pts.some(function(p){return p.status==='insucesso';}) || pts.some(function(p){return p.eh_retorno;});
    var heroTitulo,chipCls,chipTxt,ativo=false;
    if(cancelada){heroTitulo='Entrega cancelada';chipCls='c';chipTxt='Cancelada';}
    else if(problema && (entregue || est>=2)){heroTitulo='Houve um problema na entrega';chipCls='c';chipTxt='Não entregue';}
    else if(entregue){heroTitulo='Entrega concluída!';chipCls='f';chipTxt='Entregue';}
    else if(d.status==='em_rota'){heroTitulo='Seu pedido está a caminho';chipCls='a';chipTxt='A caminho';ativo=true;}
    else if(d.status==='em_coleta'||d.status==='aguardando_coleta'){heroTitulo='Entregador a caminho da coleta';chipCls='sp';chipTxt='A caminho da coleta';ativo=true;}
    else {heroTitulo='Preparando sua entrega';chipCls='sp';chipTxt='Recebido';ativo=true;}
    var passoFinal = problema ? {b:'Não entregue',s:'Houve um problema na entrega'} : {b:'Entregue',s:d.concluida_em?hora(d.concluida_em):'—'};
    var passos=[
      {b:'Pedido recebido',s:hora(d.criado_em)},
      {b:'Entregador a caminho da coleta',s: mb0.nome ? esc(mb0.nome) : 'Localizando entregador'},
      {b:'Coletado · a caminho da entrega',s: d.chegada_coleta_em?('Coletado '+hora(d.chegada_coleta_em)):(d.status==='em_rota'?'A caminho da entrega':'—')},
      passoFinal
    ];
    var finalErro = problema && (entregue || est>=2);
    var tl=passos.map(function(p,i){
      var cls;
      if(i===3){ cls = finalErro ? 'done' : (entregue ? 'done' : 'next'); }
      else { cls = i<est?'done':(i===est?'now':'next'); }
      var ic = i===3&&finalErro ? '!' : (cls==='done'?'✓':(cls==='now'?'●':(i+1)));
      var extra = i===3&&finalErro ? ' style="background:#D0584F;color:#fff"' : '';
      return '<div class="step '+(cls==='next'?'fut':'')+'"><div class="dot '+cls+'"'+extra+'>'+ic+'</div>'+(i<3?'<div class="ln '+(i<est?'on':'')+'"></div>':'')+'<div class="tx"><b>'+p.b+'</b><small>'+esc(p.s)+'</small></div></div>';
    }).join('');
    var mb=d.motoboy||{}; var avMb=fotoMotoboy?'<img src="'+esc(fotoMotoboy)+'" alt="">':esc(ini(mb.nome)||'—');
    var tel=soDigitos(mb.telefone);
    var ligar= tel? '<a class="lig" href="tel:+55'+tel+'">📞 Ligar</a>' : '';
    document.getElementById('side').innerHTML =
      '<div class="big">'+esc(heroTitulo)+'</div><div class="subl">'+(entregue?('Entregue '+esc(hora(d.concluida_em))):(cancelada?'Esta entrega foi cancelada.':''))+'</div>'+
      '<span class="chip '+chipCls+(ativo?' ativo':'')+'"><span class="d"></span>'+esc(chipTxt)+'</span>'+
      '<div class="tl">'+tl+'</div>'+
      '<div class="card"><div class="rot">Entrega em</div><div class="v">'+esc(destino?(destino.endereco||destino.nome||'—'):'—')+'</div>'+
      (mb.nome?'<div class="mb"><div class="av">'+avMb+'</div><div style="flex:1;min-width:0"><b>'+esc(mb.nome)+'</b><small>Entregador</small></div>'+ligar+'</div>':'')+'</div>'+
      '<div class="foot">Atualiza sozinho · você não precisa recarregar</div>';
    // ETA só quando a caminho
    var etaEl=document.getElementById('eta'), etaTxt='';
    if(d.status==='em_rota'&&d.posicao_atual&&destino&&destino.lat){var km=distKm({lat:d.posicao_atual.lat,lng:d.posicao_atual.lng},{lat:Number(destino.lat),lng:Number(destino.lng)});if(km!=null){etaTxt='chega em ~'+Math.max(1,Math.round(km/22*60))+' min';}}
    if(etaTxt){etaEl.style.display='flex';etaEl.querySelector('span').textContent=etaTxt;} else {etaEl.style.display='none';}
    return destino;
  }

  function atualizarMapa(d, destino){
    if(!mapa) return;
    var pts=[];
    if(destino&&destino.lat){var dll=[Number(destino.lat),Number(destino.lng)];pts.push(dll);if(mkDest)mkDest.setLatLng(dll);else mkDest=L.marker(dll,{icon:pinIcon('#D0584F')}).addTo(mapa).bindPopup('Destino');}
    if(d.coleta&&d.coleta.lat){var cll=[Number(d.coleta.lat),Number(d.coleta.lng)];pts.push(cll);if(mkColeta)mkColeta.setLatLng(cll);else mkColeta=L.marker(cll,{icon:pinIcon('#1F9D6B')}).addTo(mapa).bindPopup('Coleta');}
    // Traçado real (trajeto GPS)
    if(d.trajeto&&d.trajeto.length>1){var seg=d.trajeto.map(function(p){return [p.lat,p.lng];});seg.forEach(function(ll){pts.push(ll);});if(linhaTraj)linhaTraj.setLatLngs(seg);else linhaTraj=L.polyline(seg,{color:'#185FA5',weight:5,opacity:.85,lineJoin:'round'}).addTo(mapa);}
    // Motoboy ao vivo
    if(d.posicao_atual){var mll=[d.posicao_atual.lat,d.posicao_atual.lng];pts.push(mll);if(mkMoto)mkMoto.setLatLng(mll);else mkMoto=L.marker(mll,{icon:motoIcon(fotoMotoboy,corMarca),zIndexOffset:1000}).addTo(mapa).bindPopup('Entregador');}
    if(primeira&&pts.length){mapa.fitBounds(pts,{padding:[50,50],maxZoom:16});primeira=false;setTimeout(function(){mapa.invalidateSize();},60);}
  }
  function pinIcon(cor){return L.divIcon({className:'',iconSize:[30,38],iconAnchor:[15,36],html:'<div style="width:30px;height:30px;border-radius:50% 50% 50% 0;background:'+cor+';transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.3)"></div>'});}
  function motoIcon(foto,cor){var inner=foto?('<img src="'+foto+'" style="width:100%;height:100%;object-fit:cover">'):'🛵';return L.divIcon({className:'',iconSize:[52,52],iconAnchor:[26,26],html:'<div style="width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid '+(cor||'#185FA5')+';box-shadow:0 4px 14px rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px">'+inner+'</div>'});}

  function iniciarMapa(googleKey, cb){
    mapa=L.map('mapa',{zoomControl:true});
    function osm(){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(mapa);cb();}
    if(!googleKey){osm();return;}
    // Google via GoogleMutant (mesmo do painel). Fallback: OSM.
    var g=document.createElement('script');
    g.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(googleKey)+'&loading=async';
    g.onload=function(){var m=document.createElement('script');m.src='https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.0/dist/Leaflet.GoogleMutant.js';m.onload=function(){try{L.gridLayer.googleMutant({type:'roadmap'}).addTo(mapa);cb();}catch(e){osm();}};m.onerror=osm;document.body.appendChild(m);};
    g.onerror=osm;document.body.appendChild(g);
  }

  function erro(t,s){boot.className='erro';boot.innerHTML='<div style="font-size:34px">📦</div><div style="font-size:16px;font-weight:800;color:var(--tinta)">'+esc(t)+'</div><div>'+esc(s||'')+'</div>';}

  async function carregar(){
    if(!token){erro('Link inválido','Falta o código de rastreio no endereço.');return;}
    try{
      var r=await fetch(API+'/integracao/rastreio/'+encodeURIComponent(token));
      if(!r.ok){ if(!montado) erro('Entrega não encontrada','Confira o link com quem enviou.'); return; }
      var d=await r.json();
      aplicarMarca(d);
      if(!montado){
        boot.style.display='none'; app.style.display='block';
        document.getElementById('prot').textContent=d.protocolo||'';
        iniciarMapa(d.google_key, function(){ var dest=atualizarSide(d); atualizarMapa(d,dest); });
        montado=true;
      } else {
        var dest=atualizarSide(d); atualizarMapa(d,dest);
      }
      if(d.status==='entregue'||d.status==='cancelada'){ if(timer) clearInterval(timer); }
    }catch(e){}
  }
  function carregarLeaflet(cb){if(window.L)return cb();var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=cb;document.body.appendChild(s);}
  carregarLeaflet(function(){carregar();timer=setInterval(carregar,12000);});
})();
</script>
</body>
</html>
